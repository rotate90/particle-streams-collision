    { sec: "Красные частицы" },
    { id: "bAngle", name: "направление W", min: -180, max: 180, step: 1, def: DEFAULTS.bAngle,
      fmt: function (v) { return fmtDeg(v); } },
    { id: "bSpeed", name: "модуль скорости W", min: 0, max: 900, step: 5, def: DEFAULTS.bSpeed,
      fmt: function (v) { return v.toFixed(0) + " px/с"; } },
    { id: "bNoise", name: "разброс потока", min: 0, max: 0.3, step: 0.005, def: DEFAULTS.bNoise,
      fmt: function (v) { return (v * 100).toFixed(1) + " %"; } },
    { id: "bRadius", name: "радиус частиц B", min: 0.5, max: 40, step: 0.5, def: DEFAULTS.bRadius,
      fmt: function (v) { return v.toFixed(1) + " px"; } },
    { id: "bInterval", name: "интервал рождения t<sub>B</sub>", min: 0.02, max: 0.6, step: 0.005,
      def: DEFAULTS.bInterval,
      fmt: function (v) { return v.toFixed(3) + " с  (" + (1 / v).toFixed(1) + "/с)"; } },

    { sec: "Физика столкновений" },
    { id: "massRatio", name: "отношение масс m<sub>A</sub>/m<sub>B</sub>", min: 0, max: 1, step: 0.01,
      def: DEF_MASS_SLIDER, fmt: function (v) { return "× " + sliderToMass(v).toFixed(2); } },
    { id: "elasticity", name: "упругость столкновений", min: 0, max: 1, step: 0.01, def: 1,
      fmt: function (v) { return v.toFixed(2) + (v >= 0.999 ? "  (упругие)" : ""); } },
    { id: "roughness", name: "шероховатость частиц", min: 0, max: 1, step: 0.01,
      def: CORE_DEF.ROUGHNESS,
      fmt: function (v) { return v.toFixed(2) + (v <= 0.001 ? "  (гладкие)" : ""); } },

    { sec: "Сцена" },
    { id: "timeScale", name: "скорость времени", min: 0.1, max: 4, step: 0.1, def: 1,
      fmt: function (v) { return "× " + v.toFixed(1); } },
    { id: "trails", name: "траектории частиц", type: "check", def: false },
    { id: "walls", name: "прямоугольные стенки", type: "check", def: false },
    { id: "flowWalls", name: "стенки вдоль потоков", type: "check", def: false },
  ];

  var byId = {};
  controls.forEach(function (c) { if (c.id) byId[c.id] = c; });

  function fmtDeg(deg) {
    var d = ((deg % 360) + 360) % 360;
    var arrows = ["→", "↗", "↑", "↖", "←", "↙", "↓", "↘"];
    var a = d > 180 ? d - 360 : d;
    var ar = arrows[(Math.round(d / 45) % 8 + 8) % 8];
    return ar + " " + (a > 0 ? "+" : "") + a.toFixed(0) + "°";
  }
  // отношение масс по логарифмической шкале: 0 → 0.05, 1 → 20, 0.5 → 1
  var MASS_MIN = 0.05, MASS_MAX = 20, MASS_SPAN = MASS_MAX / MASS_MIN;
  function sliderToMass(s) { return MASS_MIN * Math.pow(MASS_SPAN, PS.clamp(s, 0, 1)); }
  function logMassToSlider(m) { return Math.log(m / MASS_MIN) / Math.log(MASS_SPAN); }

  /* ------------------------------------------------------------------
     Состояние приложения
     ------------------------------------------------------------------ */
  var world = PS.createWorld(Object.assign({ width: window.innerWidth, height: window.innerHeight }, DEFAULTS));
  var defs = {};
  controls.forEach(function (c) { if (c.id) defs[c.id] = c.def; });

  var noiseMode = CORE_DEF.NOISE_MODE;
  var paused = false, singleStep = false;
  var trails = false, ghosts = true, showGrid = true;
  var sceneDirty = true;
  var timeScale = 1;
  var acc = 0, lastT = 0, fpsSmooth = 60;
  var lastHud = 0, impulsesAtLastHud = 0;
  var stepDt = CONFIG.STEP_DT;

  /* --- камера: панорама удерживанием ЛКМ, масштаб колесом --- */
  var cam = { x: 0, y: 0, scale: 1 };            // мировые координаты центра вида
  var MIN_SCALE = CONFIG.MIN_SCALE, MAX_SCALE = CONFIG.MAX_SCALE;
  var panning = false, panId = -1, panLast = { x: 0, y: 0 };
  var DPR = 1;

  /* ------------------------------------------------------------------
     Построение панели
     ------------------------------------------------------------------ */
  var body = $("panelBody");
  var inputs = {};
  var intervalHint = null;

  function addSection(title) {
    var h = document.createElement("h3");
    h.className = "sec";
    h.innerHTML = title;
    body.appendChild(h);
    return h;
  }

  controls.forEach(function (c) {
    if (c.sec) {
      addSection(c.sec);
      return;
    }

    var row = document.createElement("div");
    row.className = "row";

    if (c.type === "check") {
      row.className = "checkrow";
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = !!c.def;
      cb.id = "chk_" + c.id;
      var lb = document.createElement("label");
      lb.setAttribute("for", cb.id);
      lb.textContent = c.name;
      lb.style.cursor = "pointer";
      row.appendChild(cb);
      row.appendChild(lb);
      cb.addEventListener("change", function () { setValue(c.id, cb.checked); });
      inputs[c.id] = cb;
      body.appendChild(row);
      if (c.hint) {
        var hint = document.createElement("div");
        hint.className = "hint"; hint.textContent = c.hint;
        body.appendChild(hint);
      }
      return;
    }

    var lab = document.createElement("div");
    lab.className = "lab";
    var nm = document.createElement("span");
    nm.className = "name";
    nm.innerHTML = c.name;
    var val = document.createElement("span");
    val.className = "val";
    lab.appendChild(nm);

    if (c.type === "select") {
      row.appendChild(lab);
      var sel = document.createElement("select");
      c.options.forEach(function (o) {
        var op = document.createElement("option");
        op.value = o[0];
        op.textContent = o[1];
        if (o[0] === c.def) op.selected = true;
        sel.appendChild(op);
      });
      sel.addEventListener("change", function () { setValue(c.id, sel.value); });
      row.appendChild(sel);
      inputs[c.id] = sel;
      body.appendChild(row);
      return;
    }

    lab.appendChild(val);
    row.appendChild(lab);
    var inp = document.createElement("input");
    inp.type = "range";
    inp.min = c.min; inp.max = c.max; inp.step = c.step; inp.value = c.def;
    inp.setAttribute("aria-label", c.name.replace(/<[^>]+>/g, ""));
    row.appendChild(inp);
    c._val = val;
    val.textContent = c.fmt(c.def);
    inp.addEventListener("input", function () {
      var v = parseFloat(inp.value);
      setValue(c.id, v);
      val.textContent = c.fmt(v);
    });
    inputs[c.id] = inp;
    body.appendChild(row);
    if (c.hint) {
      var rangeHint = document.createElement("div");
      rangeHint.className = "hint"; rangeHint.textContent = c.hint;
      body.appendChild(rangeHint);
    }

    if (c.id === "bInterval") {
      intervalHint = document.createElement("div");
      intervalHint.className = "hint";
      intervalHint.style.padding = "2px 2px 8px";
      body.appendChild(intervalHint);
    }
    if (c.id === "maxParticles") {
      var lim = document.createElement("div");
      lim.className = "hint";
      lim.style.padding = "2px 2px 8px";
      lim.innerHTML = "Жёсткий потолок числа частиц: при его достижении новые не рождаются " +
        "(в строке состояния появится предупреждение).";
      body.appendChild(lim);
    }
  });

  /* пресеты */
  addSection("Пресеты");
  var pbox = document.createElement("div");
  pbox.className = "presets";
  var PRESETS = {
    "Встречные потоки": { aAngle: 0, aSpeed: 260, aNoise: 0.06, aRadius: 9, aInterval: 0.12, bAngle: 180, bSpeed: 260, bNoise: 0.06, bRadius: 9, bInterval: 0.12, massRatio: logMassToSlider(1), elasticity: 1, roughness: 0 },
    "Перекрёстный огонь": { aAngle: 25, aSpeed: 320, aNoise: 0.10, aRadius: 13, aInterval: 0.09, bAngle: 155, bSpeed: 320, bNoise: 0.10, bRadius: 13, bInterval: 0.09, massRatio: logMassToSlider(1), elasticity: 1, roughness: 0 },
    "Тяжёлые против лёгких": { aAngle: 0, aSpeed: 220, aNoise: 0.04, aRadius: 17, aInterval: 0.08, bAngle: 180, bSpeed: 300, bNoise: 0.05, bRadius: 6, bInterval: 0.05, massRatio: logMassToSlider(8), elasticity: 1, roughness: 0 },
    "Плотный поток (нагрузка)": { aAngle: 8, aSpeed: 420, aNoise: 0.25, aRadius: 5, aInterval: 0.02, bAngle: 172, bSpeed: 420, bNoise: 0.25, bRadius: 5, bInterval: 0.02, massRatio: logMassToSlider(1), elasticity: 1, roughness: 0 }
  };
  Object.keys(PRESETS).forEach(function (k) {
    var b = document.createElement("button");
    b.textContent = k;
    b.addEventListener("click", function () { applyPreset(PRESETS[k]); });
    pbox.appendChild(b);
  });
  var bReset = document.createElement("button");
  bReset.textContent = "Настройки по умолчанию";
  bReset.addEventListener("click", function () { applyPreset(defs); });
  pbox.appendChild(bReset);
  body.appendChild(pbox);

  

  /* ------------------------------------------------------------------
     Присвоение значений
     ------------------------------------------------------------------ */
  function setValue(id, v) {
    sceneDirty = true;
    switch (id) {
      case "noiseMode": noiseMode = v; world.noiseMode = v; return;
      case "trails": trails = !!v; hardClear(); return;
      case "ghosts": ghosts = !!v; return;
      case "grid": showGrid = !!v; return;
      case "walls":
        PS.setWalls(world, v);
        inputs.flowWalls.checked = world.flowWallsEnabled;
        hardClear(); return;
      case "flowWalls":
        PS.setFlowWalls(world, v);
        inputs.walls.checked = world.wallsEnabled;
        hardClear(); return;
      case "maxParticles": world.maxParticles = Math.round(v); return;
      case "timeScale": timeScale = v; return;
      case "massRatio": world.massRatio = sliderToMass(v); return;
      case "elasticity": world.restitution = PS.clamp(v, 0, 1); return;
      case "roughness": world.roughness = PS.clamp(v, 0, 1); return;
      case "aInterval":
      case "bInterval":
        v = PS.clamp(v, CONFIG.INTERVAL_MIN, CONFIG.INTERVAL_MAX);
        var emI = (id === "aInterval") ? world.emitters[0] : world.emitters[1];
        emI.interval = v;
        world.interval = Math.min(world.emitters[0].interval, world.emitters[1].interval);
        PS.layout(world, W, H);
        updateIntervalHint();
        return;
    }
    var em = (id.charAt(0) === "a") ? world.emitters[0] : world.emitters[1];
    if (id === "aAngle" || id === "bAngle") em.angle = v * PI / 180;
    else if (id === "aSpeed" || id === "bSpeed") { em.speed = v; PS.layout(world, W, H); }
    else if (id === "aNoise" || id === "bNoise") em.noise = v;
    else if (id === "aRadius" || id === "bRadius") {
      em.radius = Math.max(PS.MIN_R, v);
      PS.layout(world, W, H);
    }
  }

  function updateIntervalHint() {
    if (!intervalHint) return;
    var eA = world.emitters[0], eB = world.emitters[1];
    // время жизни частицы в кадре: путь между точками A и B плюс запас
    var span = Math.abs(eB.x - eA.x) + CONFIG.HINT_SPAN_PAD;
  }

  /* ------------------------------------------------------------------
     Холст сцены
     ------------------------------------------------------------------ */
  function applyPreset(p) {
    Object.keys(p).forEach(function (id) {
      var c = byId[id];
      if (!c) return;
      var v = p[id];
      if (inputs[id] && inputs[id].type === "range") {
        inputs[id].value = v;
        if (c._val) c._val.textContent = c.fmt(v);
      }
      if (inputs[id] && inputs[id].type === "checkbox") inputs[id].checked = !!v;
      setValue(id, v);
    });
    updateIntervalHint();
  }
  /* ------------------------------------------------------------------
     Холст сцены
     ------------------------------------------------------------------ */
  var view = $("view"), ctx = view.getContext("2d", { alpha: true });
  var backgroundCanvas = $("sceneBg"), backgroundCtx = backgroundCanvas.getContext("2d", { alpha: false });
  var backgroundView = { x: NaN, y: NaN, scale: NaN, grid: null };
  var W = 0, H = 0;

  function hardClear() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, view.width, view.height);
    backgroundView.scale = NaN;
    sceneDirty = true;
    clearTrails();
  }

  /* ------------------------------------------------------------------
     Траектории копятся прямо в видимом слое под частицами. Полноэкранного
     копирования на каждый кадр нет. При изменении камеры переносим слой;
     короткие перемещения копим, а невидимые отрезки не рисуем.
     ------------------------------------------------------------------ */
  var trailCanvas = $("trajectories");
  var trailCtx = trailCanvas.getContext("2d", { alpha: true });
  var trailTmp = document.createElement("canvas");          // для переноса буфера
  var trailTmpCtx = trailTmp.getContext("2d", { alpha: true });
  var trailMark = new WeakMap();                            // частица → её прежнее положение
  var trailView = { s: 0, tx: 0, ty: 0 };
  var trailDPR = 1;
  var trailGroups = [new Map(), new Map()], activeTrailGroups = [];
  trailCanvas.style.opacity = CONFIG.LONG_TRAIL_COMPOSITE;

  function clearTrails() {
    trailCtx.setTransform(1, 0, 0, 1, 0, 0);
    trailCtx.clearRect(0, 0, trailCanvas.width, trailCanvas.height);
    trailCanvas.style.display = trails ? "block" : "none";
    trailMark = new WeakMap();
    trailView.s = 0;
  }

  /* Перенос нужен только при движении камеры, в том числе без живых частиц. */
  function syncTrailBuffer() {
    var s = trailDPR * cam.scale;
    var tx = trailDPR * (W / 2 - cam.x * cam.scale);
    var ty = trailDPR * (H / 2 - cam.y * cam.scale);
    if (trailView.s) {
      var a = s / trailView.s;
      var bx = tx - a * trailView.tx;
      var by = ty - a * trailView.ty;
      if (Math.abs(a - 1) > 1e-9 || Math.abs(bx) > 1e-6 || Math.abs(by) > 1e-6) {
        // Вспомогательный холст выделяется в полном размере только при переносе.
        if (trailTmp.width !== trailCanvas.width || trailTmp.height !== trailCanvas.height) {
          trailTmp.width = trailCanvas.width; trailTmp.height = trailCanvas.height;
        }
        trailTmpCtx.setTransform(1, 0, 0, 1, 0, 0);
        trailTmpCtx.clearRect(0, 0, trailTmp.width, trailTmp.height);
        trailTmpCtx.drawImage(trailCanvas, 0, 0);
        trailCtx.setTransform(1, 0, 0, 1, 0, 0);
        trailCtx.clearRect(0, 0, trailCanvas.width, trailCanvas.height);
        trailCtx.setTransform(a, 0, 0, a, bx, by);
        trailCtx.imageSmoothingEnabled = true;
        trailCtx.imageSmoothingQuality = "high";
        trailCtx.drawImage(trailTmp, 0, 0);
      }
    }
    trailView.s = s; trailView.tx = tx; trailView.ty = ty;
    return trailView;
  }

  /* Дорисовывает в буфер отрезки, пройденные частицами с прошлого кадра. */
  function addLongTrails() {
    var ps = world.particles, n = ps.length;
    var pr = syncTrailBuffer(), s = pr.s, tx = pr.tx, ty = pr.ty;
    if (!n) return;

    var i, p, rec, g;
    for (i = 0; i < activeTrailGroups.length; i++) activeTrailGroups[i].count = 0;
    activeTrailGroups.length = 0;
    var minMove = CONFIG.LONG_TRAIL_MIN_MOVE_PX * trailDPR;
    var minMove2 = minMove * minMove;
    var pad = CONFIG.LONG_TRAIL_WIDTH_MAX_PX * trailDPR;

    for (i = 0; i < n; i++) {
      p = ps[i];
      rec = trailMark.get(p);
      if (rec === undefined) { trailMark.set(p, { x: p.x, y: p.y }); continue; }
      if (rec.x === p.x && rec.y === p.y) continue;         // частица не двигалась

      var x0 = rec.x * s + tx, y0 = rec.y * s + ty;
      var x1 = p.x * s + tx, y1 = p.y * s + ty;
      if (Math.max(x0, x1) < -pad || Math.min(x0, x1) > trailCanvas.width + pad ||
          Math.max(y0, y1) < -pad || Math.min(y0, y1) > trailCanvas.height + pad) {
        rec.x = p.x; rec.y = p.y;
        continue;
      }
      var dx = x1 - x0, dy = y1 - y0;
      if (dx * dx + dy * dy < minMove2) continue;
      rec.x = p.x; rec.y = p.y;

      // толщина следа — доля радиуса частицы, но не тоньше пикселя на экране
      var w = PS.clamp(p.r * cam.scale * CONFIG.LONG_TRAIL_WIDTH_OF_RADIUS,
        CONFIG.LONG_TRAIL_WIDTH_MIN_PX, CONFIG.LONG_TRAIL_WIDTH_MAX_PX) * trailDPR;
      w = Math.max(0.5, Math.round(w / CONFIG.LONG_TRAIL_WIDTH_BUCKET) * CONFIG.LONG_TRAIL_WIDTH_BUCKET);

      g = trailGroups[p.s].get(w);
      if (g === undefined) {
        g = { w: w, pts: [], count: 0, color: "rgba(" + CONFIG.STREAM_RGB[p.s] + "," + CONFIG.LONG_TRAIL_ALPHA + ")" };
        trailGroups[p.s].set(w, g);
      }
      if (!g.count) activeTrailGroups.push(g);
      g.pts[g.count++] = x0; g.pts[g.count++] = y0;
      g.pts[g.count++] = x1; g.pts[g.count++] = y1;
    }

    trailCtx.setTransform(1, 0, 0, 1, 0, 0);
    trailCtx.lineCap = "round";
    for (i = 0; i < activeTrailGroups.length; i++) {
      var gr = activeTrailGroups[i];
      trailCtx.strokeStyle = gr.color;
      trailCtx.lineWidth = gr.w;
      trailCtx.beginPath();
      for (var q = 0; q < gr.count; q += 4) {
        trailCtx.moveTo(gr.pts[q], gr.pts[q + 1]);
        trailCtx.lineTo(gr.pts[q + 2], gr.pts[q + 3]);
      }
      trailCtx.stroke();
    }
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, CONFIG.DPR_MAX);
    var rect = view.getBoundingClientRect();
    W = Math.max(CONFIG.MIN_CANVAS_W, Math.round(rect.width));
    H = Math.max(CONFIG.MIN_CANVAS_H, Math.round(rect.height));
    view.width = Math.round(W * DPR);
    view.height = Math.round(H * DPR);
    backgroundCanvas.width = view.width; backgroundCanvas.height = view.height;
    // Траектории имеют ту же плотность пикселей, что и частицы: CSS-масштабирование
    // холста с пониженным разрешением делает тонкие диагональные линии ступенчатыми.
    trailDPR = DPR;
    trailCanvas.width = view.width;
    trailCanvas.height = view.height;
    PS.layout(world, W, H);
    clampCamera();
    applyView();
    updateIntervalHint();
    hardClear();
  }

  /* --- вид: мировые координаты → экранные --- */
  function applyView(target) {
    (target || ctx).setTransform(DPR * cam.scale, 0, 0, DPR * cam.scale,
      DPR * (W / 2 - cam.x * cam.scale), DPR * (H / 2 - cam.y * cam.scale));
  }
  function clampCamera() {
    sceneDirty = true;
    cam.scale = PS.clamp(cam.scale, MIN_SCALE, MAX_SCALE);
    var lim = CONFIG.PAN_LIMIT_FACTOR * Math.max(W, H);
    cam.x = PS.clamp(cam.x, -lim, lim);
    cam.y = PS.clamp(cam.y, -lim, lim);
    PS.setView(world, cam.scale, cam.x, cam.y);
  }
  function screenToWorld(sx, sy) {
    return { x: (sx - W / 2) / cam.scale + cam.x, y: (sy - H / 2) / cam.scale + cam.y };
  }
  function resetView() {
    // исходный кадр: обе точки A и B видны целиком
    cam.scale = CONFIG.INITIAL_SCALE;
    cam.x = world.width / 2;
    cam.y = 0;
    clampCamera();
    hardClear();
    updateZoomChip();
    updateIntervalHint();
  }
  function zoomBy(factor, sx, sy) {
    if (sx === undefined) { sx = W / 2; sy = H / 2; }
    var before = screenToWorld(sx, sy);
    cam.scale = PS.clamp(cam.scale * factor, MIN_SCALE, MAX_SCALE);
    var after = screenToWorld(sx, sy);
    cam.x += before.x - after.x;                 // точка под курсором остаётся на месте
    cam.y += before.y - after.y;
    clampCamera();
    updateZoomChip();
  }
  function updateZoomChip() {
    var el = $("sZoom");
    if (el) el.textContent = cam.scale.toFixed(2) + "×";
  }

  /* --- сетка полотна: линии с постоянным шагом в мировых координатах --- */
  function drawGrid(target) {
    var box = VIEWPORT;                          // те же границы, что и у фона сцены
    var step = CONFIG.GRID_BASE_STEP;
    while (step * cam.scale < CONFIG.GRID_STEP_SCALE_MIN) step *= CONFIG.GRID_STEP_FACTOR;
    while (step * cam.scale > CONFIG.GRID_STEP_SCALE_MAX) step /= CONFIG.GRID_STEP_FACTOR;
    target.strokeStyle = CONFIG.GRID_COLOR;
    target.lineWidth = CONFIG.GRID_LINE_W / cam.scale;
    target.beginPath();
    for (var x = Math.floor(box.x / step) * step; x <= box.x1; x += step) {
      target.moveTo(x, box.y); target.lineTo(x, box.y1);
    }
    for (var y = Math.floor(box.y / step) * step; y <= box.y1; y += step) {
      target.moveTo(box.x, y); target.lineTo(box.x1, y);
    }
    target.stroke();
  }

  function drawBackground() {
    if (backgroundView.x === cam.x && backgroundView.y === cam.y &&
        backgroundView.scale === cam.scale && backgroundView.grid === showGrid) return;
    backgroundCtx.setTransform(1, 0, 0, 1, 0, 0);
    backgroundCtx.fillStyle = CONFIG.BG_COLOR;
    backgroundCtx.fillRect(0, 0, backgroundCanvas.width, backgroundCanvas.height);
    applyView(backgroundCtx);
    if (showGrid) drawGrid(backgroundCtx);
    backgroundView.x = cam.x; backgroundView.y = cam.y;
    backgroundView.scale = cam.scale; backgroundView.grid = showGrid;
  }

  var flowWallDrawing = { key: "", shape: null, path: null };

  function drawFlowWalls() {
    var shape = world.flowWalls;
    if (!shape) return;
    var key = shape.revision;
    if (flowWallDrawing.shape !== shape || flowWallDrawing.key !== key) {
      // Кэшируем конечные дуги в координатах мира. Масштаб и камера
      // не меняют ни их длину, ни геометрию контактов.
      var path = new Path2D();
      for (var k = 0; k < shape.curves.length; k++) {
        var points = shape.curves[k].points;
        if (!points.length) continue;
        path.moveTo(points[0].x, points[0].y);
        for (var i = 1; i < points.length; i++) path.lineTo(points[i].x, points[i].y);
      }
      flowWallDrawing.key = key; flowWallDrawing.shape = shape; flowWallDrawing.path = path;
    }
    ctx.save();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = CONFIG.FLOW_WALL_GLOW;
    ctx.lineWidth = (CONFIG.FLOW_WALL_WIDTH + 5) / cam.scale;
    ctx.stroke(flowWallDrawing.path);
    ctx.strokeStyle = CONFIG.FLOW_WALL_COLOR;
    ctx.lineWidth = CONFIG.FLOW_WALL_WIDTH / cam.scale;
    ctx.stroke(flowWallDrawing.path);
    ctx.restore();
  }

  var particleGroups = [new Map(), new Map()], activeParticleGroups = [];
  var particleSprites = new Map();

  function particleSprite(group) {
    var rr = group.r;
    var radius = Math.max(1, Math.min(CONFIG.PARTICLE_SPRITE_MAX_RADIUS,
      Math.round(rr * cam.scale * DPR * 2) / 2));
    var rim = rr * cam.scale >= CONFIG.PARTICLE_RIM_MIN_PX ?
      Math.min(CONFIG.PARTICLE_RIM_W.max, Math.max(CONFIG.PARTICLE_RIM_W.min,
        rr * CONFIG.PARTICLE_RIM_W.ofRadius)) * radius / rr : 0;
    var key = group.s + "|" + radius + "|" + rim;
    var sprite = particleSprites.get(key);
    if (sprite) {
      // Недавно использованные текстуры остаются в ограниченном кэше.
      particleSprites.delete(key); particleSprites.set(key, sprite);
      return sprite;
    }
    var image = document.createElement("canvas");
    image.width = image.height = Math.ceil(2 * (radius + 2));
    var sc = image.getContext("2d"), center = image.width / 2;
    sc.fillStyle = group.color;
    sc.beginPath(); sc.arc(center, center, radius, 0, PI * 2); sc.fill();
    if (rim) {
      sc.strokeStyle = CONFIG.PARTICLE_RIM_COLOR; sc.lineWidth = rim; sc.stroke();
    }
    sprite = { image: image, radius: radius };
    if (particleSprites.size >= CONFIG.PARTICLE_SPRITE_CACHE_SIZE) {
      particleSprites.delete(particleSprites.keys().next().value);
    }
    particleSprites.set(key, sprite);
    return sprite;
  }

  function drawParticles() {
    var i, group;
    for (i = 0; i < activeParticleGroups.length; i++) activeParticleGroups[i].count = 0;
    activeParticleGroups.length = 0;
    var ps = world.particles;
    for (i = 0; i < ps.length; i++) {
      var p = ps[i], rr = p.r;
      if (p.x + rr < VIEWPORT.x || p.x - rr > VIEWPORT.x1 ||
          p.y + rr < VIEWPORT.y || p.y - rr > VIEWPORT.y1) continue;
      group = particleGroups[p.s].get(rr);
      if (group === undefined) {
        group = { s: p.s, r: rr, points: [], count: 0, color: "rgb(" + CONFIG.PARTICLE_RGB[p.s] + ")" };
        particleGroups[p.s].set(rr, group);
      }
      if (!group.count) activeParticleGroups.push(group);
      group.points[group.count++] = p.x; group.points[group.count++] = p.y;
    }
    for (i = 0; i < activeParticleGroups.length; i++) {
      group = activeParticleGroups[i];
      var points = group.points, radius = group.r, q;
      if (radius * cam.scale < CONFIG.PARTICLE_SIMPLE_MAX_PX) {
        ctx.fillStyle = group.color;
        ctx.beginPath();
        for (q = 0; q < group.count; q += 2) {
          ctx.moveTo(points[q] + radius, points[q + 1]);
          ctx.arc(points[q], points[q + 1], radius, 0, PI * 2);
        }
        ctx.fill();
      } else {
        var sprite = particleSprite(group);
        var size = sprite.image.width * radius / sprite.radius, half = size / 2;
        for (q = 0; q < group.count; q += 2) {
          ctx.drawImage(sprite.image, points[q] - half, points[q + 1] - half, size, size);
        }
      }
    }
  }

  function drawScene() {
    // Видимый прямоугольник общий для сетки и отсечения частиц.
    VIEWPORT.w = W / cam.scale;
    VIEWPORT.h = H / cam.scale;
    VIEWPORT.x = cam.x - VIEWPORT.w / 2;
    VIEWPORT.y = cam.y - VIEWPORT.h / 2;
    VIEWPORT.x1 = VIEWPORT.x + VIEWPORT.w;
    VIEWPORT.y1 = VIEWPORT.y + VIEWPORT.h;

    drawBackground();
    if (trails) addLongTrails();
    // Полностью очищаем только динамический слой: старые частицы не затухают.
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, view.width, view.height);
    applyView();

    if (world.wallsEnabled) {
      var box = PS.wallBox(world);
      ctx.strokeStyle = "rgba(122,211,255,.8)";
      ctx.lineWidth = 2 / cam.scale;
      ctx.strokeRect(box.x0, box.y0, box.x1 - box.x0, box.y1 - box.y0);
    }
    if (world.flowWallsEnabled) drawFlowWalls();

    // две точки рождения: A (синяя) и B (красная)
    if (ghosts) {
      ctx.font = CONFIG.GHOST_FONT;
      for (var k = 0; k < world.emitters.length; k++) {
        var em = world.emitters[k];
        var rgb = CONFIG.STREAM_RGB[em.streamIdx];
        ctx.strokeStyle = "rgba(" + rgb + "," + CONFIG.GHOST_RING_ALPHA + ")";
        ctx.lineWidth = CONFIG.GHOST_RING_W / cam.scale;
        ctx.beginPath();
        ctx.arc(em.x, em.y, em.radius + CONFIG.GHOST_RING_OFFSET, 0, PI * 2);
        ctx.stroke();
        var half = world.noiseMode === "mag" ? 0 : Math.min(CONFIG.GHOST_CONE_MAX_HALF, PS.CONFIG.FLOW_SIGMA * em.noise);
        ctx.beginPath();
        ctx.moveTo(em.x, em.y);
        ctx.arc(em.x, em.y, CONFIG.GHOST_CONE_LEN, -em.angle - half, -em.angle + half);
        ctx.closePath();
        ctx.fillStyle = "rgba(" + rgb + "," + CONFIG.GHOST_CONE_ALPHA + ")";
        ctx.fill();
        ctx.beginPath();
        ctx.arc(em.x, em.y, CONFIG.GHOST_CORE_RADIUS, 0, PI * 2);
        ctx.fillStyle = "rgba(" + rgb + "," + CONFIG.GHOST_CORE_ALPHA + ")";
        ctx.fill();
        ctx.fillStyle = "rgba(" + rgb + "," + CONFIG.GHOST_LABEL_ALPHA + ")";
        ctx.fillText(em.name, em.x + CONFIG.GHOST_LABEL_DX, em.y + CONFIG.GHOST_LABEL_DY);
      }
    }

    drawParticles();
  }

  /* ------------------------------------------------------------------
     Главный цикл
     ------------------------------------------------------------------ */
  function frame(now) {
    if (!lastT) lastT = now;
    var dt = (now - lastT) / 1000;
    lastT = now;
    if (!isFinite(dt) || dt < 0) dt = 0;
    if (dt > CONFIG.MAX_FRAME_DT) dt = CONFIG.MAX_FRAME_DT;   // вкладка была в фоне
    if (dt > 0) fpsSmooth += (1 / Math.max(dt, 1e-4) - fpsSmooth) * CONFIG.FPS_SMOOTH_K;

    try {
      acc += (paused && !singleStep) ? 0 : dt * timeScale;
      singleStep = false;

      var steps = 0, budget = CONFIG.STEP_BUDGET_S;
      while (acc >= stepDt && steps < PS.MAX_SUBSTEPS && budget > 0) {
        var t0 = performance.now();
        PS.step(world, stepDt);
        budget -= (performance.now() - t0) / 1000;
        acc -= stepDt;
        steps++;
      }
      if (acc > stepDt * PS.MAX_SUBSTEPS * CONFIG.ACC_ZERO_EPS) acc = 0;  // не копим долг

      // Настройка формы работает и при остановленном времени.
      if (steps === 0 && PS.updateFlowWalls(world, dt)) {
        PS.confineFlowParticles(world); sceneDirty = true;
      }

      if (steps || sceneDirty) { drawScene(); sceneDirty = false; }

      if (now - lastHud > CONFIG.HUD_PERIOD_MS) {
        impulsesAtLastHud = world.impulses;
        lastHud = now;
        $("sFps").textContent = fpsSmooth.toFixed(0);
        $("cLimit").style.display = world.hitLimit ? "" : "none";
      }
    } catch (err) {
      // Не даём кадру умереть молча: останавливаем цикл и показываем причину.
      showFatal(err);
      return;
    }
    requestAnimationFrame(frame);
  }

  function showFatal(err) {
    if ($("fatal")) return;
    console.error(err);
    var box = document.createElement("div");
    box.id = "fatal";
    box.innerHTML = "<b>Ошибка отрисовки — цикл остановлен</b><br>" +
      String(err && err.message ? err.message : err) +
      "<br><small>Обновите страницу (F5).</small>";
    document.body.appendChild(box);
  }

  /* ------------------------------------------------------------------
     Кнопки и клавиатура
     ------------------------------------------------------------------ */
  function setPaused(v) {
    paused = v;
    $("btnPlay").textContent = paused ? "Пуск" : "Пауза";
  }
  $("btnPlay").addEventListener("click", function () { setPaused(!paused); });
  function setEmission(enabled) {
    world.emissionEnabled = enabled;
    $("btnEmission").textContent = enabled ? "Остановить генерацию" : "Возобновить генерацию";
    $("btnEmission").setAttribute("aria-pressed", String(!enabled));
  }
  function resetSimulation() {
    PS.clear(world); acc = 0; hardClear();
  }
  $("btnEmission").addEventListener("click", function () { setEmission(!world.emissionEnabled); });
  $("btnReset").addEventListener("click", resetSimulation);
  $("collapse").addEventListener("click", function () { $("panel").classList.add("hidden"); });
  $("openPanel").addEventListener("click", function () { $("panel").classList.remove("hidden"); });

  window.addEventListener("keydown", function (e) {
    if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    var k = e.key.toLowerCase();
    if (e.code === "Space") { e.preventDefault(); setPaused(!paused); }
    else if (k === "r" || k === "к") { resetSimulation(); }
    else if (k === "s" || k === "ы") { setPaused(true); singleStep = true; }
    else if (k === "f" || k === "а") { resetView(); }
    else if (k === "=" || k === "+") { zoomBy(CONFIG.KEY_ZOOM_FACTOR); }
    else if (k === "-" || k === "_") { zoomBy(1 / CONFIG.KEY_ZOOM_FACTOR); }
  });

  /* ------------------------------------------------------------------
     Панорама (удержание ЛКМ) и масштаб (колесо, пинч)
     ------------------------------------------------------------------ */
  function onPanDown(ev) {
    if (ev.button !== 0 && ev.pointerType === "mouse") return;
    panId = ev.pointerId;
    panning = true;
    panLast.x = ev.clientX;
    panLast.y = ev.clientY;
    view.classList.add("panning");
    try { view.setPointerCapture(ev.pointerId); } catch (err) { }
    ev.preventDefault();
  }
  function onPanMove(ev) {
    if (!panning || ev.pointerId !== panId) return;
    var dx = ev.clientX - panLast.x, dy = ev.clientY - panLast.y;
    panLast.x = ev.clientX;
    panLast.y = ev.clientY;
    cam.x -= dx / cam.scale;
    cam.y -= dy / cam.scale;
    clampCamera();
    updateIntervalHint();
    ev.preventDefault();
  }
  function onPanUp(ev) {
    if (!panning || (ev && ev.pointerId !== panId)) return;
    panning = false;
    panId = -1;
    view.classList.remove("panning");
    if (ev) { try { view.releasePointerCapture(ev.pointerId); } catch (err) { } }
  }

  /* ------------------------------------------------------------------
     Инициализация
     ------------------------------------------------------------------ */
  function init() {
    view.addEventListener("pointerdown", onPanDown);
    view.addEventListener("pointermove", onPanMove);
    view.addEventListener("pointerup", onPanUp);
    view.addEventListener("pointercancel", onPanUp);
    view.addEventListener("lostpointercapture", function () { onPanUp(null); });
    view.addEventListener("wheel", function (ev) {
      ev.preventDefault();
      var r = view.getBoundingClientRect();
      var f = Math.exp(-ev.deltaY * CONFIG.WHEEL_ZOOM_K);
      if (ev.deltaMode === 1) f = Math.exp(-ev.deltaY * CONFIG.WHEEL_ZOOM_K_LINE);
      zoomBy(f, ev.clientX - r.left, ev.clientY - r.top);
    }, { passive: false });
    view.addEventListener("contextmenu", function (ev) { ev.preventDefault(); });

    // Ctrl+колесо или колесо над панелью — тоже масштаб
    window.addEventListener("wheel", function (ev) {
      if (!ev.ctrlKey) return;
      ev.preventDefault();
      zoomBy(Math.exp(-ev.deltaY * CONFIG.WHEEL_ZOOM_K_CTRL));
    }, { passive: false });

    world.emitters[0].interval = defs.aInterval;
    world.emitters[1].interval = defs.bInterval;
    world.interval = Math.min(defs.aInterval, defs.bInterval);
    world.restitution = defs.elasticity;
    world.roughness = defs.roughness;
    world.massRatio = sliderToMass(defs.massRatio);
    world.maxParticles = defs.maxParticles;
    world.noiseMode = noiseMode;

    resize();
    resetView();
    window.addEventListener("resize", resize);
    window.__sim = { world: world, cam: cam, PS: PS };   // точка доступа для отладки/тестов
    requestAnimationFrame(frame);
  }

  init();
})();
</script>
</body>
</html>
